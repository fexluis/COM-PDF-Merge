  type: Method
  assemblies:
  - ConversorPDF.XLL
  namespace: ConversorPDF.XLL.Core.Services
  summary: >-
    Recupera la firma en Base64 asociada a un nombre de usuario específico.

    Si el usuario no tiene una firma configurada, devuelve la firma por defecto (Luis).
  example: []
  syntax:
    content: public string GetFirmaBase64(string username)
    parameters:
    - id: username
      type: System.String
      description: Nombre de usuario de red a buscar.
    return:
      type: System.String
      description: Cadena Base64 con la imagen de la firma.
    content.vb: Public Function GetFirmaBase64(username As String) As String
