- uid: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.UnificarSolicitudes(System.String,System.Int32,System.Int32)
  commentId: M:ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.UnificarSolicitudes(System.String,System.Int32,System.Int32)
  id: UnificarSolicitudes(System.String,System.Int32,System.Int32)
  parent: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor
  langs:
  - csharp
  - vb
  name: UnificarSolicitudes(string, int, int)
  nameWithType: IViaticosGestionProcessor.UnificarSolicitudes(string, int, int)
  fullName: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.UnificarSolicitudes(string, int, int)
  type: Method
  assemblies:
  - ConversorPDF.XLL
  namespace: ConversorPDF.XLL.Core.Interfaces
  summary: Une los diferentes componentes de un expediente de viáticos (Solicitud, Resolución, RP, CDP, Verificado) en un único archivo PDF por cada hoja del libro, aplicando opcionalmente filtro por rango de comisiones.
  example: []
  syntax:
    content: int UnificarSolicitudes(string folder, int inicio, int fin)
    parameters:
    - id: folder
      type: System.String
      description: Ruta base donde se encuentran las subcarpetas de documentos (Solicitudes, RPs, CDPs, etc.).
    - id: inicio
      type: System.Int32
      description: Número de viático inicial del rango (0 para sin filtro).
    - id: fin
      type: System.Int32
      description: Número de viático final del rango (0 para sin filtro).
    return:
      type: System.Int32
      description: Cantidad de expedientes unificados con éxito, o -1 en caso de error.
    content.vb: Function UnificarSolicitudes(folder As String, inicio As Integer, fin As Integer) As Integer
  overload: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.UnificarSolicitudes*
  nameWithType.vb: IViaticosGestionProcessor.UnificarSolicitudes(String, Integer, Integer)
  fullName.vb: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.UnificarSolicitudes(String, Integer, Integer)
