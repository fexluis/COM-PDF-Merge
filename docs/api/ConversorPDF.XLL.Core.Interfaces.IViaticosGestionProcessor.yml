- uid: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.RenombrarSolicitudes(System.String,System.Int32,System.Int32)
  commentId: M:ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.RenombrarSolicitudes(System.String,System.Int32,System.Int32)
  id: RenombrarSolicitudes(System.String,System.Int32,System.Int32)
  parent: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor
  langs:
  - csharp
  - vb
  name: RenombrarSolicitudes(string, int, int)
  nameWithType: IViaticosGestionProcessor.RenombrarSolicitudes(string, int, int)
  fullName: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.RenombrarSolicitudes(string, int, int)
  type: Method
  assemblies:
  - ConversorPDF.XLL
  namespace: ConversorPDF.XLL.Core.Interfaces
  summary: Renombra archivos PDF de solicitudes en una carpeta basándose en los datos de la hoja de CONSULTAS y validación por OCR de la cédula, aplicando opcionalmente filtro por rango de comisiones.
  example: []
  syntax:
    content: int RenombrarSolicitudes(string folder, int inicio, int fin)
    parameters:
    - id: folder
      type: System.String
      description: Ruta de la carpeta que contiene los archivos PDF a renombrar.
    - id: inicio
      type: System.Int32
      description: Número de viático inicial del rango (0 para sin filtro).
    - id: fin
      type: System.Int32
      description: Número de viático final del rango (0 para sin filtro).
    return:
      type: System.Int32
      description: Cantidad de archivos renombrados con éxito, o -1 en caso de error.
    content.vb: Function RenombrarSolicitudes(folder As String, inicio As Integer, fin As Integer) As Integer
