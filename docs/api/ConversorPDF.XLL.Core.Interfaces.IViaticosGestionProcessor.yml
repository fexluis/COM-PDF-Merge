  commentId: M:ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.RenombrarSolicitudesConDetalle(System.String,System.Int32,System.Int32)
  id: RenombrarSolicitudesConDetalle(System.String,System.Int32,System.Int32)
  parent: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor
  langs:
  - csharp
  - vb
  name: RenombrarSolicitudesConDetalle(string, int, int)
  nameWithType: IViaticosGestionProcessor.RenombrarSolicitudesConDetalle(string, int, int)
  fullName: ConversorPDF.XLL.Core.Interfaces.IViaticosGestionProcessor.RenombrarSolicitudesConDetalle(string, int, int)
  type: Method
  assemblies:
  - ConversorPDF.XLL
  namespace: ConversorPDF.XLL.Core.Interfaces
  summary: Renombra las solicitudes devolviendo el desglose completo (carpetas, motivos y contadores).
  example: []
  syntax:
    content: ResultadoRenombrado RenombrarSolicitudesConDetalle(string folder, int inicio, int fin)
    parameters:
    - id: folder
      type: System.String
      description: Ruta de la carpeta raíz del libro (se procesa también la subcarpeta Solicitudes).
    - id: inicio
      type: System.Int32
      description: Número de viático inicial del rango (0 para sin filtro).
    - id: fin
      type: System.Int32
      description: Número de viático final del rango (0 para sin filtro).
    return:
      type: ConversorPDF.XLL.Core.Models.ResultadoRenombrado
      description: Resultado con contadores y motivo por archivo; nunca null.
    content.vb: Function RenombrarSolicitudesConDetalle(folder As String, inicio As Integer, fin As Integer) As ResultadoRenombrado
