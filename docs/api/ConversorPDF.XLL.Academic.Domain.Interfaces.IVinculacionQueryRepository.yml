  summary: Obtiene una lista detallada de sesiones filtrada por sede, tercero, período, viática y rango de fechas.
  example: []
  syntax:
    content: Task<Result<IReadOnlyCollection<SesionListItem>>> GetSesionesAsync(int? idSede, int? idTercero, int? idPeriodo, bool soloViaticas, DateTime? fechaDesde, DateTime? fechaHasta, int limit, int offset, CancellationToken ct)
    parameters:
    - id: idSede
      type: System.Nullable{System.Int32}
      description: Identificador opcional de la sede.
    - id: idTercero
      type: System.Nullable{System.Int32}
      description: Identificador opcional del tercero (docente).
    - id: idPeriodo
      type: System.Nullable{System.Int32}
      description: Identificador opcional del período académico.
    - id: soloViaticas
      type: System.Boolean
      description: Si es true, solo retorna sesiones marcadas con viática.
    - id: fechaDesde
      type: System.Nullable{System.DateTime}
      description: Fecha inicial opcional del rango de búsqueda (inclusive).
    - id: fechaHasta
      type: System.Nullable{System.DateTime}
      description: Fecha final opcional del rango de búsqueda (inclusive).
    - id: limit
      type: System.Int32
      description: Número máximo de registros a retornar.
    - id: offset
      type: System.Int32
      description: Número de registros a omitir (paginación).
    - id: ct
      type: System.Threading.CancellationToken
      description: Token de cancelación.
    return:
      type: System.Threading.Tasks.Task{CSharpFunctionalExtensions.Result{System.Collections.Generic.IReadOnlyCollection{ConversorPDF.XLL.Academic.Domain.Models.SesionListItem}}}
