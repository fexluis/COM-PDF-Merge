  type: Method
  assemblies:
  - ConversorPDF.XLL
  namespace: ConversorPDF.XLL.Core.Services
  summary: >-
    Combina una serie de archivos PDF existentes en un nuevo documento único.

    Este proceso importa las páginas de cada archivo de origen de forma secuencial.
  example: []
  syntax:
    content: public void CombinarPDFs(IEnumerable<string> archivos, string rutaSalida)
    parameters:
    - id: archivos
      type: System.Collections.Generic.IEnumerable{System.String}
      description: Colección de rutas completas a los archivos PDF de entrada.
    - id: rutaSalida
      type: System.String
      description: Ruta absoluta donde se guardará el PDF resultante.
    content.vb: Public Sub CombinarPDFs(archivos As IEnumerable(Of String), rutaSalida As String)
  overload: ConversorPDF.XLL.Core.Services.PdfService.CombinarPDFs*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Se lanza si no se agregan páginas al documento de salida (ej. si todos los archivos de origen son inválidos).
